<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="robots" content="index,follow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AccountingService",
        "name": "Studio Scarimbolo",
        "url": "https://www.studioscarimbolo.it/",
        "logo": "https://www.studioscarimbolo.it/assets/logo.png",
        "image": "https://www.studioscarimbolo.it/assets/home_about.jpg",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Via Brigata Bari 5/A",
          "addressLocality": "Bari",
          "postalCode": "70123",
          "addressCountry": "IT"
        }
      }
    </script>
  </head>
  <body>
    <noscript>Lo studio Scarimbolo, grazie alla pluriennale esperienza nel campo della consulenza aziendale, è in grado di offrire soluzioni adatte alle esigenze del mercato accompagnando, senza indugio e in modo proattivo, la crescita di ciascuna azienda.<br/>Il nostro obiettivo primario è fornire assistenza attenta e costante attraverso una rete di professionisti qualificati.</noscript>
    <div id="root"></div>
    <form name="contatti" netlify data-netlify="true" method="POST" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <script>
      if (window.netlifyIdentity) {
        var identityTokenHash = window.location.hash || "";
        var hasIdentityToken =
          identityTokenHash.indexOf("invite_token=") !== -1 ||
          identityTokenHash.indexOf("recovery_token=") !== -1 ||
          identityTokenHash.indexOf("confirmation_token=") !== -1 ||
          identityTokenHash.indexOf("email_change_token=") !== -1;

        window.netlifyIdentity.on("init", function(user) {
          if (hasIdentityToken) {
            window.netlifyIdentity.open();
          }
          if (!user) {
            window.netlifyIdentity.on("login", function() {
              document.location.href = "/admin/CMS/";
            });
          }
        });
      }
    </script>
  </body>
</html>
