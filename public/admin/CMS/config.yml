backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: site_content
    label: Contenuti sito
    files:
      - name: services
        label: Servizi
        file: src/content/services.json
        format: json
        fields:
          - label: Servizi IT
            name: it
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Slug URL, name: slug, widget: string, hint: "Modificare solo se deve cambiare anche l'indirizzo della pagina." }
              - { label: Titolo, name: title, widget: string }
              - { label: Testo breve, name: summary, widget: text }
              - label: Descrizione
                name: content
                widget: markdown
                minimal: true
                modes: ["rich_text"]
                buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
                editor_components: []
                hint: "Usa l'editor visuale. Non inserire codice HTML."
          - label: Servizi EN
            name: en
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Slug URL, name: slug, widget: string, hint: "Modificare solo se deve cambiare anche l'indirizzo della pagina." }
              - { label: Titolo, name: title, widget: string }
              - { label: Testo breve, name: summary, widget: text }
              - label: Descrizione
                name: content
                widget: markdown
                minimal: true
                modes: ["rich_text"]
                buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"]
                editor_components: []
                hint: "Usa l'editor visuale. Non inserire codice HTML."
