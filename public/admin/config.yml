backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: path_home
    label: "studioscarimbolo.it/"
    description: "Homepage: scegli Italiano o Inglese e modifica solo quella lingua."
    files:
      - name: home_it
        label: "Italiano"
        file: src/content/home.it.json
        format: json
        fields:
          - { label: Navigazione, name: nav, widget: object, fields: [{ label: Servizi, name: servizi, widget: string }, { label: News e scadenze, name: lavori, widget: string }, { label: Aree di attivit?, name: aree, widget: string }, { label: Chi siamo, name: chi, widget: string }, { label: Contatti, name: contatti, widget: string }] }
          - { label: Hero /, name: hero, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Sottotitolo, name: subtitle, widget: text }, { label: CTA contatti, name: cta1, widget: string }, { label: CTA servizi, name: cta2, widget: string }, { label: Immagine sfondo hero, name: backgroundImage, widget: image, required: false }] }
          - { label: Sezione benvenuto /, name: welcome, widget: object, fields: [{ label: Sopratitolo, name: since, widget: string }, { label: Titolo, name: heading, widget: string }, { label: Testo 1, name: intro1, widget: text }, { label: Testo 2, name: intro2, widget: text }, { label: Link, name: more, widget: string }, { label: Immagine, name: image, widget: image, required: false }, { label: Icona, name: icon, widget: image, required: false }] }
          - { label: Sezione servizi /, name: services, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Bottone servizi, name: more, widget: string }, { label: Bottone aree attivit?, name: activitiesCta, widget: string }] }
          - { label: Sezione chi siamo /, name: about, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Paragrafo 1, name: p1, widget: text }, { label: Paragrafo 2, name: p2, widget: text }, { label: Bottone, name: cta, widget: string }, { label: Immagine, name: image, widget: image, required: false }] }
          - { label: Sezione contatti, name: contact, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Messaggio, name: msg, widget: text }, { label: Placeholder nome, name: name, widget: string }, { label: Placeholder email, name: email, widget: string }, { label: Placeholder messaggio, name: message, widget: string }, { label: Bottone invio, name: submit, widget: string }, { label: Label email, name: emailLabel, widget: string }, { label: Label telefono, name: phoneLabel, widget: string }, { label: Stato invio, name: sending, widget: string }, { label: Stato successo, name: success, widget: string }, { label: Stato fallback, name: fallback, widget: string }] }
          - { label: Footer, name: footer, widget: object, fields: [{ label: Privacy, name: privacy, widget: string }, { label: Cookie, name: cookie, widget: string }, { label: Prefisso copyright, name: copyPrefix, widget: string }, { label: Testo copyright, name: copySuffix, widget: text }] }
      - name: home_en
        label: "Inglese"
        file: src/content/home.en.json
        format: json
        fields:
          - { label: Navigazione, name: nav, widget: object, fields: [{ label: Servizi, name: servizi, widget: string }, { label: News e scadenze, name: lavori, widget: string }, { label: Aree di attivit?, name: aree, widget: string }, { label: Chi siamo, name: chi, widget: string }, { label: Contatti, name: contatti, widget: string }] }
          - { label: Hero /, name: hero, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Sottotitolo, name: subtitle, widget: text }, { label: CTA contatti, name: cta1, widget: string }, { label: CTA servizi, name: cta2, widget: string }, { label: Immagine sfondo hero, name: backgroundImage, widget: image, required: false }] }
          - { label: Sezione benvenuto /, name: welcome, widget: object, fields: [{ label: Sopratitolo, name: since, widget: string }, { label: Titolo, name: heading, widget: string }, { label: Testo 1, name: intro1, widget: text }, { label: Testo 2, name: intro2, widget: text }, { label: Link, name: more, widget: string }, { label: Immagine, name: image, widget: image, required: false }, { label: Icona, name: icon, widget: image, required: false }] }
          - { label: Sezione servizi /, name: services, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Bottone servizi, name: more, widget: string }, { label: Bottone aree attivit?, name: activitiesCta, widget: string }] }
          - { label: Sezione chi siamo /, name: about, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Paragrafo 1, name: p1, widget: text }, { label: Paragrafo 2, name: p2, widget: text }, { label: Bottone, name: cta, widget: string }, { label: Immagine, name: image, widget: image, required: false }] }
          - { label: Sezione contatti, name: contact, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Titolo, name: title, widget: string }, { label: Messaggio, name: msg, widget: text }, { label: Placeholder nome, name: name, widget: string }, { label: Placeholder email, name: email, widget: string }, { label: Placeholder messaggio, name: message, widget: string }, { label: Bottone invio, name: submit, widget: string }, { label: Label email, name: emailLabel, widget: string }, { label: Label telefono, name: phoneLabel, widget: string }, { label: Stato invio, name: sending, widget: string }, { label: Stato successo, name: success, widget: string }, { label: Stato fallback, name: fallback, widget: string }] }
          - { label: Footer, name: footer, widget: object, fields: [{ label: Privacy, name: privacy, widget: string }, { label: Cookie, name: cookie, widget: string }, { label: Prefisso copyright, name: copyPrefix, widget: string }, { label: Testo copyright, name: copySuffix, widget: text }] }
  - name: path_services
    label: "studioscarimbolo.it/servizi"
    description: "Pagina servizi e dettaglio /servizi/{slug}. Scegli la lingua da modificare."
    files:
      - name: services_it
        label: "Italiano"
        file: src/content/services.it.json
        format: json
        fields:
          - { label: Servizi, name: items, widget: list, summary: "{{fields.title}}", fields: [{ label: Slug URL, name: slug, widget: string, hint: "Modificare solo se deve cambiare anche l'indirizzo della pagina." }, { label: Titolo, name: title, widget: string }, { label: Immagine servizio, name: image, widget: image, required: false }, { label: Testo breve, name: summary, widget: text }, { label: Contenuto, name: content, widget: markdown, minimal: true, modes: ["rich_text"], buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"], editor_components: [], hint: "Usa l'editor visuale. Non inserire codice HTML." }] }
      - name: services_en
        label: "Inglese"
        file: src/content/services.en.json
        format: json
        fields:
          - { label: Servizi, name: items, widget: list, summary: "{{fields.title}}", fields: [{ label: Slug URL, name: slug, widget: string, hint: "Modificare solo se deve cambiare anche l'indirizzo della pagina." }, { label: Titolo, name: title, widget: string }, { label: Immagine servizio, name: image, widget: image, required: false }, { label: Testo breve, name: summary, widget: text }, { label: Contenuto, name: content, widget: markdown, minimal: true, modes: ["rich_text"], buttons: ["bold", "italic", "bulleted-list", "numbered-list", "link"], editor_components: [], hint: "Usa l'editor visuale. Non inserire codice HTML." }] }
  - name: path_news
    label: "studioscarimbolo.it/news"
    description: "Pagina elenco news/scadenze. Scegli la lingua da modificare."
    files:
      - name: news_page_it
        label: "Italiano"
        file: src/content/newsPage.it.json
        format: json
        fields:
          - { label: Testi news, name: news, widget: object, fields: [{ label: Titolo, name: title, widget: string }, { label: Sottotitolo, name: subtitle, widget: text }, { label: Leggi tutto, name: readMore, widget: string }, { label: Archivio, name: archive, widget: string }, { label: Not found title, name: notFoundTitle, widget: string }, { label: Not found back, name: notFoundBack, widget: string }, { label: Label condivisione, name: shareLabel, widget: string }] }
          - { label: Testi scadenze, name: scadenze, widget: object, fields: [{ label: Sottotitolo, name: subtitle, widget: text }, { label: Leggi tutto, name: readMore, widget: string }, { label: Archivio, name: archive, widget: string }, { label: Not found title, name: notFoundTitle, widget: string }, { label: Not found back, name: notFoundBack, widget: string }] }
          - { label: Immagini /news, name: assets, widget: object, fields: [{ label: Sfondo testata, name: headerBackground, widget: image, required: false }, { label: Immagine fallback, name: fallbackImage, widget: image, required: false }] }
      - name: news_page_en
        label: "Inglese"
        file: src/content/newsPage.en.json
        format: json
        fields:
          - { label: Testi news, name: news, widget: object, fields: [{ label: Titolo, name: title, widget: string }, { label: Sottotitolo, name: subtitle, widget: text }, { label: Leggi tutto, name: readMore, widget: string }, { label: Archivio, name: archive, widget: string }, { label: Not found title, name: notFoundTitle, widget: string }, { label: Not found back, name: notFoundBack, widget: string }, { label: Label condivisione, name: shareLabel, widget: string }] }
          - { label: Testi scadenze, name: scadenze, widget: object, fields: [{ label: Sottotitolo, name: subtitle, widget: text }, { label: Leggi tutto, name: readMore, widget: string }, { label: Archivio, name: archive, widget: string }, { label: Not found title, name: notFoundTitle, widget: string }, { label: Not found back, name: notFoundBack, widget: string }] }
          - { label: Immagini /news, name: assets, widget: object, fields: [{ label: Sfondo testata, name: headerBackground, widget: image, required: false }, { label: Immagine fallback, name: fallbackImage, widget: image, required: false }] }
