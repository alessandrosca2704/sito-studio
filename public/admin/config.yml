  - name: path_about
    label: "studioscarimbolo.it/chi-siamo"
    description: "Pagina Chi siamo. Scegli la lingua da modificare."
    files:
      - name: about_it
        label: "Italiano"
        file: src/content/about.it.json
        format: json
        fields:
          - { label: Titolo hero, name: heroTitle, widget: string }
          - { label: Immagini /chi-siamo, name: images, widget: object, fields: [{ label: Sfondo hero, name: heroBackground, widget: image, required: false }, { label: Sfondo focus, name: focusBackground, widget: image, required: false }, { label: Foto team, name: teamPhoto, widget: image, required: false }, { label: Badge team, name: teamBadge, widget: image, required: false }] }
          - { label: Titolo intro, name: introTitle, widget: string }
          - { label: Paragrafi intro, name: introParagraphs, widget: list, field: { label: Paragrafo, name: paragraph, widget: text } }
          - { label: Titolo focus, name: focusTitle, widget: string }
          - { label: Testo focus, name: focusLead, widget: text }
          - { label: Punti focus, name: focusBullets, widget: list, field: { label: Punto, name: item, widget: string } }
          - { label: Titolo team, name: teamTitle, widget: string }
          - { label: Nome, name: teamName, widget: string }
          - { label: Ruolo, name: teamRole, widget: string }
          - { label: Bio, name: teamBio, widget: list, field: { label: Paragrafo, name: paragraph, widget: text } }
          - { label: Didascalia badge, name: badgeCaption, widget: string }
      - name: about_en
        label: "Inglese"
        file: src/content/about.en.json
        format: json
        fields:
          - { label: Titolo hero, name: heroTitle, widget: string }
          - { label: Immagini /chi-siamo, name: images, widget: object, fields: [{ label: Sfondo hero, name: heroBackground, widget: image, required: false }, { label: Sfondo focus, name: focusBackground, widget: image, required: false }, { label: Foto team, name: teamPhoto, widget: image, required: false }, { label: Badge team, name: teamBadge, widget: image, required: false }] }
          - { label: Titolo intro, name: introTitle, widget: string }
          - { label: Paragrafi intro, name: introParagraphs, widget: list, field: { label: Paragrafo, name: paragraph, widget: text } }
          - { label: Titolo focus, name: focusTitle, widget: string }
          - { label: Testo focus, name: focusLead, widget: text }
          - { label: Punti focus, name: focusBullets, widget: list, field: { label: Punto, name: item, widget: string } }
          - { label: Titolo team, name: teamTitle, widget: string }
          - { label: Nome, name: teamName, widget: string }
          - { label: Ruolo, name: teamRole, widget: string }
          - { label: Bio, name: teamBio, widget: list, field: { label: Paragrafo, name: paragraph, widget: text } }
          - { label: Didascalia badge, name: badgeCaption, widget: string }
  - name: path_activities
    label: "studioscarimbolo.it/aree-di-attivit?"
    description: "Pagina Aree di attivit?. Scegli la lingua da modificare."
    files:
      - name: activities_it
        label: "Italiano"
        file: src/content/activities.it.json
        format: json
        fields:
          - { label: Titolo hero, name: heroTitle, widget: string }
          - { label: Immagine testata /aree-di-attivit?, name: heroBackground, widget: image, required: false }
          - { label: Blocchi, name: blocks, widget: list, summary: "{{fields.title}}", fields: [{ label: ID sezione, name: id, widget: string }, { label: Titolo, name: title, widget: string }, { label: Parola evidenziata, name: highlight, widget: string }, { label: Immagine sottosezione, name: image, widget: image, required: false }, { label: Paragrafi, name: paragraphs, widget: list, field: { label: Paragrafo, name: paragraph, widget: text } }, { label: Punti elenco, name: bullets, widget: list, required: false, field: { label: Punto, name: item, widget: text } }] }
      - name: activities_en
        label: "Inglese"
        file: src/content/activities.en.json
        format: json
        fields:
          - { label: Titolo hero, name: heroTitle, widget: string }
          - { label: Immagine testata /aree-di-attivit?, name: heroBackground, widget: image, required: false }
          - { label: Blocchi, name: blocks, widget: list, summary: "{{fields.title}}", fields: [{ label: ID sezione, name: id, widget: string }, { label: Titolo, name: title, widget: string }, { label: Parola evidenziata, name: highlight, widget: string }, { label: Immagine sottosezione, name: image, widget: image, required: false }, { label: Paragrafi, name: paragraphs, widget: list, field: { label: Paragrafo, name: paragraph, widget: text } }, { label: Punti elenco, name: bullets, widget: list, required: false, field: { label: Punto, name: item, widget: text } }] }
  - name: path_privacy
    label: "studioscarimbolo.it/privacy"
    description: "Pagina Privacy. Scegli la lingua da modificare."
    files:
      - name: privacy_it
        label: "Italiano"
        file: src/content/privacy.it.json
        format: json
        fields:
          - { label: Titolo, name: title, widget: string }
          - { label: Immagine testata, name: heroBackground, widget: image, required: false }
          - { label: Nota CMS, name: bodyNote, widget: text }
      - name: privacy_en
        label: "Inglese"
        file: src/content/privacy.en.json
        format: json
        fields:
          - { label: Titolo, name: title, widget: string }
          - { label: Immagine testata, name: heroBackground, widget: image, required: false }
          - { label: Nota CMS, name: bodyNote, widget: text }

  - name: site_settings
    label: "Impostazioni generali condivise"
    description: "Brand, contatti, social e SEO condivisi tra le lingue."
    files:
      - name: settings
        label: "Impostazioni generali"
        file: src/content/siteSettings.json
        format: json
        fields:
          - { label: Brand, name: brand, widget: object, fields: [{ label: Nome, name: name, widget: string }, { label: Logo, name: logo, widget: image, required: false }] }
          - { label: Contatti, name: contact, widget: object, fields: [{ label: Email, name: email, widget: string }, { label: Telefono, name: phone, widget: string }, { label: Oggetto email, name: mailtoSubject, widget: string }, { label: URL mappa Google, name: mapEmbedUrl, widget: text }] }
          - { label: Social, name: social, widget: object, fields: [{ label: Testo fascia social, name: intro, widget: string }, { label: Label contatto diretto, name: directContactLabel, widget: string }, { label: Facebook URL, name: facebookUrl, widget: string }, { label: LinkedIn URL, name: linkedinUrl, widget: string }] }
          - { label: Credits, name: credits, widget: object, fields: [{ label: Testo, name: label, widget: string }, { label: URL, name: url, widget: string }] }
          - { label: SEO Home, name: seo, widget: object, fields: [{ label: Home, name: home, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }, { label: URL, name: url, widget: string }, { label: Immagine, name: image, widget: image, required: false }, { label: Tipo, name: type, widget: string }] }] }
